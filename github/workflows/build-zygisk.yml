name: Build Po-AGP Zygisk

on:
  workflow_dispatch:
  push:
    paths:
      - 'poagp-zygisk-source.zip'
      - '.github/workflows/build-zygisk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Extract source and install the Android SDK components
        shell: bash
        run: |
          python3 -m zipfile -e poagp-zygisk-source.zip "$RUNNER_TEMP/poagp"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME_17_X64" >> "$GITHUB_PATH"
          JAVA_HOME="$JAVA_HOME_17_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865'

      - name: Fetch the native dependencies
        shell: bash
        run: |
          deps="$RUNNER_TEMP/poagp-deps"
          mkdir -p "$deps"
          git clone https://github.com/JingMatrix/LSPlant.git "$deps/lsplant"
          git -C "$deps/lsplant" checkout 7a768e31ffb2852797631b5140b54f9702a78743
          git -C "$deps/lsplant" submodule update --init --recursive \
            lsplant/src/main/jni/external/dex_builder
          git clone https://github.com/bytedance/android-inline-hook.git "$deps/shadowhook"
          git -C "$deps/shadowhook" checkout 854c775c2c3676e57a0f383597ebf420b5204161

      - name: Compile and package
        shell: bash
        run: |
          root="$RUNNER_TEMP/poagp"
          deps="$RUNNER_TEMP/poagp-deps"
          build="$RUNNER_TEMP/poagp-build"
          src="$root/module-v1.7.6-zygisk/zygisk-src"
          ndk="$ANDROID_HOME/ndk/29.0.14206865"
          output_dir="$GITHUB_WORKSPACE/output"
          mkdir -p "$output_dir"
          python3 "$src/build-dex.py" "$build/generated/hook_dex.hpp" --sdk "$ANDROID_HOME"
          cmake -G Ninja -S "$src" -B "$build/native" \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-35 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DLSPLANT_DIR="$deps/lsplant" -DSHADOWHOOK_DIR="$deps/shadowhook" \
            -DHOOK_DEX_DIR="$build/generated"
          cmake --build "$build/native" --target poagp
          python3 "$root/build-v1.7.6-zygisk.py" "$build/native/arm64-v8a.so" \
            --readelf "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --out "$output_dir/破-AGP_v1.7.6_Zygisk.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: poagp-v1.7.6-zygisk
          path: output/*
          if-no-files-found: error
